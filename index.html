<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />

    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="cache-control" content="no-cache" />
    <title>노트 서재</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --text: #222222;
        --muted: #5c5c5c;
        --line: #e0e0e0;
        --accent: #d60505;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --surface: #262626;
          --text: #dadada;
          --muted: #9a9fa6;
          --line: #363636;
          --accent: #f23b3b;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      }
      .hidden {
        display: none !important;
      }
      .loading {
        padding-top: 40vh;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
      }
      .card {
        width: min(360px, calc(100% - 32px));
        margin: 18vh auto 0;
        padding: 32px 28px 28px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        text-align: center;
      }
      .title {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      .instructions {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 15px;
      }
      .field {
        position: relative;
      }
      input[type="password"],
      input[type="text"] {
        width: 100%;
        height: 48px;
        padding: 0 48px 0 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: transparent;
        color: var(--text);
        font-size: 16px;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      .toggle {
        position: absolute;
        top: 0;
        right: 0;
        width: 48px;
        height: 48px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
      }
      .submit {
        width: 100%;
        height: 48px;
        margin-top: 12px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .error {
        min-height: 20px;
        margin: 12px 0 0;
        color: #c4423a;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <p id="staticrypt_loading" class="loading">…</p>

      <form id="staticrypt-form" class="card" action="#" method="post">
        <p class="title">노트 서재</p>

            type="password"
            name="password"

        </div>

      </form>
    </div>

        // 글 페이지가 저장된 비밀번호로 열리므로 항상 기억한다 (이 기기에서 잠그기는 서재 맨 아래).
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, true);
        if (!isSuccessful) document.querySelector(".error").textContent = templateError;
      });
    </script>
  </body>
</html>
