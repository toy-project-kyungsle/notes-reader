<html lang="ko">

    <meta http-equiv="cache-control" content="no-cache" />
    <title>노트 서재</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --text: #222222;
        --muted: #5c5c5c;
        --line: #e0e0e0;
        --accent: #d60505;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --surface: #262626;
          --text: #dadada;
          --muted: #9a9fa6;
          --line: #363636;
          --accent: #f23b3b;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        word-break: keep-all;
      }
      .hidden {
        display: none !important;
      }
      .loading {
        padding-top: 40vh;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
      }
      .card {
        width: min(360px, calc(100% - 32px));
        margin: 18vh auto 0;
        padding: 32px 28px 28px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        text-align: center;
      }
      .title {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      .instructions {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 15px;
      }
      .field {
        position: relative;
      }
      input[type="password"],
      input[type="text"] {
        width: 100%;
        height: 48px;
        padding: 0 48px 0 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: transparent;
        color: var(--text);
        font-size: 16px;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      input:disabled {
        opacity: 0.5;
      }
      .toggle {
        position: absolute;
        top: 0;
        right: 0;
        width: 48px;
        height: 48px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
      }
      .submit {
        width: 100%;
        height: 48px;
        margin-top: 12px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .submit:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .error {
        min-height: 20px;
        margin: 12px 0 0;
        color: #c4423a;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <p id="staticrypt_loading" class="loading">…</p>

    <div id="staticrypt_content" class="hidden">
      <form id="staticrypt-form" class="card" action="#" method="post">
        <p class="title">노트 서재</p>

          <input
            id="staticrypt-password"
            type="password"
            name="password"

        </div>

        if (left <= 0) return 0;
        if (left > LOCK_MS) {
          // 기기 시계를 되돌렸으면 남은 시간이 1분을 넘지 않게 다시 잡는다.
          save(lockKey, Date.now() + LOCK_MS);
          return LOCK_MS;
        }
        return left;
      }

      // 다른 페이지(글)는 이 저장소 키에 남긴 비밀번호로만 열린다. 같은 주소의 다른 사이트와 겹치지 않게 이름을 따로 둔다.
      const templateConfig = {
        rememberExpirationKey: "notes_reader_expiration",
        rememberPassphraseKey: "notes_reader_passphrase",
        replaceHtmlCallback: function (plainHTML) {
          forgetFailures(); // 풀렸으면 틀린 횟수를 지운다
          const params = new URLSearchParams(location.search);
          const next = params.get("next");
          if (next && /^[a-z0-9-]+\/[A-Za-z0-9_.-]+\.html$/.test(next)) {
            location.replace(next);
            return;
          }
          if (params.has("staticrypt_logout") || params.has("next")) history.replaceState(null, "", location.pathname + location.hash);
          document.write(plainHTML);
          document.close();
        },
        clearLocalStorageCallback: null,
      };

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);
      const form = document.getElementById("staticrypt-form"),
        input = document.getElementById("staticrypt-password"),
        submit = form.querySelector(".submit"),
        errorBox = form.querySelector(".error"),
        buttonText = submit.textContent;
      let lockTimer = null,
        busy = false;

      // 막혀 있으면 입력란과 버튼을 끄고 버튼에 남은 초를 센다. 풀리면 다시 켠다.
      // 안내 문구(role=alert)는 막힐 때 한 번만 바꿔 화면 낭독기가 매초 읽지 않게 한다.
      function showLock() {
        clearTimeout(lockTimer);
        const left = lockRemaining();
        input.disabled = submit.disabled = left > 0;
        if (!left) {
          submit.textContent = buttonText;
          if (errorBox.dataset.locked) errorBox.textContent = "";
          delete errorBox.dataset.locked;
          input.focus();
          return;
        }
        if (!errorBox.dataset.locked) {
          errorBox.dataset.locked = "1";
          errorBox.textContent = `비밀번호를 ${Math.max(load(failKey), FREE_TRIES)}번 틀려 1분 동안 입력할 수 없습니다.`;
        }
        submit.textContent = `${Math.ceil(left / 1000)}초 뒤에 다시 입력`;
        lockTimer = setTimeout(showLock, ((left - 1) % 1000) + 1); // 남은 초가 바뀌는 때에 맞춰 다시 그린다
      }

      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
        if (!isSuccessful) {
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          showLock();
        }
      };

      const toggle = document.querySelector(".toggle");
      toggle.addEventListener("click", function () {
        const input = document.getElementById("staticrypt-password");
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        toggle.textContent = show ? "◎" : "◉";
        toggle.title = show ? templateToggleAltHide : templateToggleAltShow;
        toggle.setAttribute("aria-label", toggle.title);
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (busy) return; // 확인하는 1초 남짓 동안 Enter를 여러 번 눌러도 한 번으로 센다
        if (lockRemaining()) return showLock(); // 다른 탭에서 막혔을 수도 있다
        busy = true;
        // 글 페이지가 저장된 비밀번호로 열리므로 항상 기억한다 (이 기기에서 잠그기는 서재 맨 아래).
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, true);
        busy = false;
        if (isSuccessful) return;
        const failures = load(failKey) + 1;
        save(failKey, failures);
        if (failures >= FREE_TRIES) {
          save(lockKey, Date.now() + LOCK_MS);
          input.value = "";
          showLock();
          return;
        }
        errorBox.textContent = `${templateError} ${FREE_TRIES - failures}번 더 틀리면 1분 동안 입력할 수 없습니다.`;
        input.select();
      });
    </script>
  </body>
</html>
